name: A32 Kernel Builder by itsmeleju

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Cache kernel build and Clang
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          out/
          clang/
        key: ${{ runner.os }}-kernel-${{ github.sha }}

    - name: Setup build environment
      uses: ./.github/actions/setup-clang

    # WE REMOVE THE SEPARATE "Configure kernel" STEP AND MERGE IT INTO THE BUILD STEP
    - name: Build kernel
      shell: bash
      run: |
        # 1. MOVE TOOLCHAIN TO A NEW HOME (To break cache locks)
        echo "[*] Migrating toolchain to avoid cache locks..."
        mkdir -p ${{ github.workspace }}/toolchain
        cp -af ${{ github.workspace }}/clang/* ${{ github.workspace }}/toolchain/
        
        # 2. FORCE PERMISSIONS ON THE NEW DIRECTORY
        echo "[*] Forcing permissions on new toolchain path..."
        chmod -R 777 ${{ github.workspace }}/toolchain
        find ${{ github.workspace }}/toolchain -type f -exec chmod +x {} +
        
        # 3. SET ABSOLUTE PATHS TO THE NEW HOME
        export TC_DIR="${{ github.workspace }}/toolchain"
        export PATH="$TC_DIR:$PATH"
        
        # 4. PREPARE OUTPUT
        mkdir -p out
        
        # 5. CONFIGURATION
        echo "[*] Generating defconfig..."
        make -j$(nproc) O=out ARCH=arm64 \
            CC="$TC_DIR/clang" \
            CROSS_COMPILE="$TC_DIR/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_DIR/arm-linux-gnueabi-" \
            a32_noobie_defconfig

        echo "[*] Applying olddefconfig..."
        make -j$(nproc) O=out ARCH=arm64 \
            CC="$TC_DIR/clang" \
            CROSS_COMPILE="$TC_DIR/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_DIR/arm-linux-gnueabi-" \
            olddefconfig

        # 6. THE MAIN BUILD
        echo "[*] Starting Final Compilation..."
        make -j$(nproc) O=out \
            ARCH=arm64 \
            CC="$TC_DIR/clang" \
            LD="$TC_DIR/ld.lld" \
            AR="$TC_DIR/llvm-ar" \
            NM="$TC_DIR/llvm-nm" \
            OBJCOPY="$TC_DIR/llvm-objcopy" \
            OBJDUMP="$TC_DIR/llvm-objdump" \
            READELF="$TC_DIR/llvm-readelf" \
            STRIP="$TC_DIR/llvm-strip" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$TC_DIR/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_DIR/arm-linux-gnueabi-" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-w -O2 -pipe -Wno-int-conversion" \
            KCPPFLAGS="-O2"
          
    - name: Upload Kernel Image and DTB
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: A32-Kernel-${{ github.run_id }}
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dtb
          out/arch/arm64/boot/dts/mediatek/*.dtb
        if-no-files-found: error

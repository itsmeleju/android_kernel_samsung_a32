name: A32 Kernel Builder by itsmeleju

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Cache kernel build and Clang
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          out/
          clang/
        key: ${{ runner.os }}-kernel-${{ github.sha }}

    - name: Setup build environment
      uses: ./.github/actions/setup-clang

    # ✅ FIX 1: safer flags + no -w
    - name: Configure kernel
      shell: bash
      run: |
        export KCFLAGS="-w -O2 -pipe"
        export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
        make ARCH=arm64 O=out a32_noobie_defconfig

    # ✅ FIX 2: force correct assembler + full clang usage
    #  export KCFLAGS="-O2 -pipe -Wno-unused-variable -Wno-sign-compare"
    - name: Build kernel
      shell: bash
      run: |
        export KCFLAGS="-w -O2 -pipe" 
        export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
        make -j$(nproc) \
          ARCH=arm64 \
          O=out

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dts/

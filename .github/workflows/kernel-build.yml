name: A32 Kernel Builder by itsmeleju
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa  # your branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Cache kernel build and Clang
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          out/
          clang/
        key: ${{ runner.os }}-kernel-${{ github.sha }}

    - name: Setup build environment
      uses: ./actions/setup-clang

    - name: Configure kernel
      run: |
        export KCFLAGS="-O2 -pipe -Wno-unused-variable -Wno-format -Wno-sign-compare"
        export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
        make ARCH=arm64 LLVM=1 O=out a32_noobie_defconfig
      shell: bash

    - name: Build kernel
      run: |
        export KCFLAGS="-O2 -pipe -Wno-unused-variable -Wno-format -Wno-sign-compare"
        export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
        make -j$(nproc) ARCH=arm64 LLVM=1 O=out
      shell: bash

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dts/

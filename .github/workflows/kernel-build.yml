name: A32 Kernel Builder by itsmeleju

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Cache kernel build and Clang
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          out/
          clang/
        key: ${{ runner.os }}-kernel-${{ github.sha }}

    - name: Setup build environment
      uses: ./.github/actions/setup-clang

    - name: Configure kernel
      run: |
          make ARCH=arm64 O=out a32_noobie_defconfig
          make ARCH=arm64 O=out olddefconfig # IMPORTANT: Handle KernelSU/New config symbols automatically

    - name: Build kernel
      shell: bash
      run: |
        # Based on your logs, the files are in 'clang/', not 'clang/bin/'
        CLANG_BIN="${{ github.workspace }}/clang"
        
        # Add it to the PATH
        export PATH="$CLANG_BIN:$PATH"
        
        # Verify - this should now pass
        if [ ! -f "$CLANG_BIN/ld.lld" ]; then
          echo "ERROR: ld.lld still not found!"
          exit 1
        fi

        export KCFLAGS="-w -O2 -pipe -Wno-int-conversion"
        export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
        
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          READELF=llvm-readelf \
          STRIP=llvm-strip \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CLANG_TRIPLE=aarch64-linux-gnu-
          
    - name: Upload Kernel Image and DTB
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: A32-Kernel-${{ github.run_id }}
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dtb
          out/arch/arm64/boot/dts/mediatek/*.dtb
        if-no-files-found: error

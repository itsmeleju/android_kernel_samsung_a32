name: A32 Kernel Builder by itsmeleju

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Cache kernel build and Clang
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          out/
          clang/
        key: ${{ runner.os }}-kernel-${{ github.sha }}

    - name: Setup build environment
      uses: ./.github/actions/setup-clang

    - name: Configure kernel
      run: |
          make ARCH=arm64 O=out a32_noobie_defconfig
          make ARCH=arm64 O=out olddefconfig # IMPORTANT: Handle KernelSU/New config symbols automatically

    - name: Build kernel
      shell: bash
      run: |
        # 1. Fix Permissions for the entire toolchain
        # We use 777 here to be absolutely sure every sub-process can execute
        chmod -R 777 ${{ github.workspace }}/clang
        
        # 2. Setup absolute paths
        CLANG_BIN="${{ github.workspace }}/clang"
        export PATH="$CLANG_BIN:$PATH"
        
        # 3. Optimization & Warning suppression
        export KCFLAGS="-w -O2 -pipe -Wno-int-conversion"
        export KCPPFLAGS="-O2"
        export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
        
        # 4. Preparation (Clean -> Config -> Update)
        mkdir -p out
        
        echo "[*] Cleaning and generating .config..."
        make ARCH=arm64 O=out a32_noobie_defconfig
        
        echo "[*] Handling new config symbols (KernelSU etc)..."
        make ARCH=arm64 O=out olddefconfig
        
        # 5. The Main Build Command
        echo "[*] Starting compilation..."
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          READELF=llvm-readelf \
          STRIP=llvm-strip \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CLANG_TRIPLE=aarch64-linux-gnu-
          
    - name: Upload Kernel Image and DTB
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: A32-Kernel-${{ github.run_id }}
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dtb
          out/arch/arm64/boot/dts/mediatek/*.dtb
        if-no-files-found: error

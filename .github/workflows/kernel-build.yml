name: A32 Kernel Builder by NoobieThingZ

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4

      - name: 🗄️ Cache Toolchain & Build
        uses: actions/cache@v4
        with:
          path: |
            clang/
            out/
          key: ${{ runner.os }}-kernel-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-kernel-

      - name: ⚙️ Setup Environment (Local Action)
        uses: ./.github/actions/setup-clang

      - name: 🔨 Build Kernel
        shell: bash
        run: |
          # Define Toolchain Path
          TC_DIR="${{ github.workspace }}/clang/bin"
          
          # Build Arguments to fix spinlock and version mismatch errors
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            CC=clang
            LLVM=1
            LLVM_IAS=0
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KCFLAGS="-w -pipe -O2 -fno-integrated-as -Wno-error"
            KCPPFLAGS="-O2"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          mkdir -p out

          # 1. Generate Config
          make "${MAKE_ARGS[@]}" a32_noobie_defconfig

          # 2. Build Image and DTBs
          make -j$(nproc) "${MAKE_ARGS[@]}"

      - name: 📤 Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A32-Kernel-Build
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: error

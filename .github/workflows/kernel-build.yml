name: A32 Kernel Builder by itsmeleju

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Cache kernel build and Clang
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          out/
          clang/
        key: ${{ runner.os }}-kernel-${{ github.sha }}

    - name: Setup build environment
      uses: ./.github/actions/setup-clang

    - name: Build kernel
      shell: bash
      run: |
        # 1. DEFINE AND VERIFY DIRECTORIES
        # If you used 'git clone ... clang', the binaries are in 'clang/bin'
        TC_DIR="${{ github.workspace }}/clang/bin"
        
        # Check if the compiler actually exists at this path
        if [ ! -f "$TC_DIR/clang" ]; then
          echo "ERROR: Clang not found at $TC_DIR/clang"
          echo "Searching for clang location..."
          find ${{ github.workspace }}/clang -name clang
          exit 1
        fi

        # 2. FIX PERMISSIONS
        chmod -R +x ${{ github.workspace }}/clang/bin
        
        # 3. PREPARE OUTPUT
        mkdir -p out

        # 4. CONFIGURATION
        echo "[*] Generating defconfig..."
        make -j$(nproc) O=out ARCH=arm64 \
            CC="$TC_DIR/clang" \
            CROSS_COMPILE="$TC_DIR/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_DIR/arm-linux-gnueabi-" \
            a32_noobie_defconfig

        echo "[*] Applying olddefconfig..."
        make -j$(nproc) O=out ARCH=arm64 \
            CC="$TC_DIR/clang" \
            CROSS_COMPILE="$TC_DIR/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_DIR/arm-linux-gnueabi-" \
            olddefconfig

        # 5. MAIN BUILD
        # Main Build Command
        make -j$(nproc) O=out \
            ARCH=arm64 \
            CC="$TC_DIR/clang" \
            LD="$TC_DIR/ld.lld" \
            AR="$TC_DIR/llvm-ar" \
            NM="$TC_DIR/llvm-nm" \
            OBJCOPY="$TC_DIR/llvm-objcopy" \
            OBJDUMP="$TC_DIR/llvm-objdump" \
            READELF="$TC_DIR/llvm-readelf" \
            STRIP="$TC_DIR/llvm-strip" \
            CROSS_COMPILE="$TC_DIR/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_DIR/arm-linux-gnueabi-" \
            LLVM=1 \
            LLVM_IAS=0 \
            AS="$TC_DIR/aarch64-linux-gnu-as" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-w -O2 -pipe -Wno-int-conversion"
          
    - name: Upload Kernel Image and DTB
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: A32-Kernel-${{ github.run_id }}
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dtb
          out/arch/arm64/boot/dts/mediatek/*.dtb
        if-no-files-found: error

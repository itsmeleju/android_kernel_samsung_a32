name: A32 Kernel Builder by itsmeleju

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Cache kernel build and Clang
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          out/
          clang/
        key: ${{ runner.os }}-kernel-${{ github.sha }}

    - name: Setup build environment
      uses: ./.github/actions/setup-clang

    # ✅ FIX 1: safer flags + no -w
    - name: Configure kernel
      shell: bash
      run: |
        export KCFLAGS="-O2 -pipe -Wno-unused-variable -Wno-sign-compare"
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out a32_noobie_defconfig

    # ✅ FIX 2: force correct assembler + full clang usage
    - name: Build kernel
      shell: bash
      run: |
        export KCFLAGS="-O2 -pipe -Wno-unused-variable -Wno-sign-compare"
        make -j$(nproc) \
          ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          O=out

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dts/

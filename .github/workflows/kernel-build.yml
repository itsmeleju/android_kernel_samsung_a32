name: A32 Kernel Builder by itsmeleju

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Cache kernel build and Clang
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          out/
          clang/
        key: ${{ runner.os }}-kernel-${{ github.sha }}

    - name: Setup build environment
      uses: ./.github/actions/setup-clang

    - name: Configure kernel
      run: |
          make ARCH=arm64 O=out a32_noobie_defconfig
          make ARCH=arm64 O=out olddefconfig # IMPORTANT: Handle KernelSU/New config symbols automatically

    - name: Build kernel
      shell: bash
      run: |
        # Define the absolute path to your downloaded clang bin
        CLANG_BIN="${{ github.workspace }}/clang/bin"
        
        # Add it to the FRONT of the PATH so 'ld.lld' is found first
        export PATH="$CLANG_BIN:$PATH"
        
        # Verify the tool exists before starting (for your logs)
        if [ ! -f "$CLANG_BIN/ld.lld" ]; then
          echo "ERROR: ld.lld not found in $CLANG_BIN"
          ls -R "${{ github.workspace }}/clang" # Help us see where it actually is
          exit 1
        fi

        export KCFLAGS="-w -O2 -pipe -Wno-int-conversion"
        export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
        
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          READELF=llvm-readelf \
          STRIP=llvm-strip \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CLANG_TRIPLE=aarch64-linux-gnu-
          
    - name: Upload Kernel Image and DTB
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: A32-Kernel-${{ github.run_id }}
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dtb
          out/arch/arm64/boot/dts/mediatek/*.dtb
        if-no-files-found: error

name: A32 Kernel Builder by NoobieThingZ

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4

      - name: 🗄️ Cache Toolchain & Build
        uses: actions/cache@v4
        with:
          path: |
            clang/
            out/
          key: ${{ runner.os }}-kernel-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-kernel-

      - name: ⚙️ Setup Environment (Local Action)
        uses: ./.github/actions/setup-clang

      - name: 🔨 Build Kernel
        shell: bash
        run: |
          # 1. Add Clang to PATH (but keep system tools accessible)
          export CLANG_BIN="${{ github.workspace }}/clang/bin"
          export PATH="$CLANG_BIN:$PATH"
          export LD_LIBRARY_PATH="${{ github.workspace }}/clang/lib:$LD_LIBRARY_PATH"
          
          # 2. Build Arguments
          # We explicitly set HOSTCC/HOSTLD to /usr/bin tools to avoid the .relr.dyn error
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            CC=clang
            HOSTCC=/usr/bin/gcc
            HOSTCXX=/usr/bin/g++
            HOSTLD=/usr/bin/ld
            LLVM=1
            LLVM_IAS=0
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            KCFLAGS="-w -pipe -O2 -fno-integrated-as -Wno-error"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          mkdir -p out

          # 3. Configure and Build
          echo "[*] Configuring with a32_noobie_defconfig..."
          make "${MAKE_ARGS[@]}" a32_noobie_defconfig

          echo "[*] Starting Kernel Compilation..."
          # Use 'all' target to ensure Image and DTBs are made
          make -j$(nproc --all) "${MAKE_ARGS[@]}" all

      - name: 📤 Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A32-Kernel-Build
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: error

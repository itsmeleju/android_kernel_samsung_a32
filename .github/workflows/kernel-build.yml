name: A32 Kernel Builder by itsmeleju

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Cache kernel build and Clang
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          out/
          clang/
        key: ${{ runner.os }}-kernel-${{ github.sha }}

    - name: Setup build environment
      uses: ./.github/actions/setup-clang

    - name: Configure kernel
      run: |
          make ARCH=arm64 O=out a32_noobie_defconfig
          make ARCH=arm64 O=out olddefconfig # IMPORTANT: Handle KernelSU/New config symbols automatically

    - name: Build kernel
      shell: bash
      run: |
        # 1. Force extreme permissions on the toolchain
        chmod -R 777 ${{ github.workspace }}/clang
        
        # 2. Define the absolute path to your binaries
        # Based on your previous logs, they are in the root 'clang' folder
        TC_PATH="${{ github.workspace }}/clang"
        
        # 3. Create output directory
        mkdir -p out

        # 4. Preparation (Defconfig & Olddefconfig)
        # We pass the absolute path to CC here so the config stage works
        make -j$(nproc) O=out ARCH=arm64 \
            CC="$TC_PATH/clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            a32_noobie_defconfig
            
        make -j$(nproc) O=out ARCH=arm64 \
            CC="$TC_PATH/clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

        # 5. Main Build
        # We define every tool with its FULL ABSOLUTE PATH to bypass 'not found' errors
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC="$TC_PATH/clang" \
          LD="$TC_PATH/ld.lld" \
          AR="$TC_PATH/llvm-ar" \
          NM="$TC_PATH/llvm-nm" \
          OBJCOPY="$TC_PATH/llvm-objcopy" \
          OBJDUMP="$TC_PATH/llvm-objdump" \
          READELF="$TC_PATH/llvm-readelf" \
          STRIP="$TC_PATH/llvm-strip" \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE="$TC_PATH/aarch64-linux-gnu-" \
          CROSS_COMPILE_ARM32="$TC_PATH/arm-linux-gnueabi-" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          KCFLAGS="-w -O2 -pipe -Wno-int-conversion"
          
    - name: Upload Kernel Image and DTB
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: A32-Kernel-${{ github.run_id }}
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dtb
          out/arch/arm64/boot/dts/mediatek/*.dtb
        if-no-files-found: error

name: A32 Kernel Builder by itsmeleju

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Cache kernel build and Clang
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          out/
          clang/
        key: ${{ runner.os }}-kernel-${{ github.sha }}

    - name: Setup build environment
      uses: ./.github/actions/setup-clang

    - name: Configure kernel
      run: |
          make ARCH=arm64 O=out a32_noobie_defconfig
          make ARCH=arm64 O=out olddefconfig # IMPORTANT: Handle KernelSU/New config symbols automatically

    - name: Build kernel
      shell: bash
      run: |
        # 1. Fix Permissions (Crucial!)
        # The extracted .tar.gz doesn't have the 'execute' bit set by default.
        chmod -R +x ${{ github.workspace }}/clang
        
        # 2. Setup absolute paths
        CLANG_BIN="${{ github.workspace }}/clang"
        export PATH="$CLANG_BIN:$PATH"
        
        # 3. Clean any 'stale' headers from previous failed runs
        mkdir -p out
        make ARCH=arm64 O=out mrproper
        
        # 4. Optimization & Warning suppression
        export KCFLAGS="-w -O2 -pipe -Wno-int-conversion"
        export KCPPFLAGS="-O2"
        export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
        
        # 5. The Build Command
        # Passing ARCH=arm64 directly solves the 'asm/bug.h' issue.
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          READELF=llvm-readelf \
          STRIP=llvm-strip \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CLANG_TRIPLE=aarch64-linux-gnu-
          
    - name: Upload Kernel Image and DTB
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: A32-Kernel-${{ github.run_id }}
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dtb
          out/arch/arm64/boot/dts/mediatek/*.dtb
        if-no-files-found: error

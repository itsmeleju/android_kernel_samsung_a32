name: A32 Kernel Builder by itsmeleju

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Cache kernel build and Clang
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          out/
          clang/
        key: ${{ runner.os }}-kernel-${{ github.sha }}

    - name: Setup build environment
      uses: ./.github/actions/setup-clang

    - name: Configure kernel
      run: |
          make ARCH=arm64 O=out a32_noobie_defconfig
          make ARCH=arm64 O=out olddefconfig # IMPORTANT: Handle KernelSU/New config symbols automatically

    - name: Build kernel
      shell: bash
      run: |
        # 1. THE PERMISSION CRUSHER
        # We find every file in the clang folder and force execute permissions
        echo "[*] Forcing permissions on toolchain..."
        find ${{ github.workspace }}/clang -type f -exec chmod 777 {} +
        
        # 2. DEFINE ABSOLUTE PATHS
        # We point directly to the files so 'make' doesn't have to search
        export TC_DIR="${{ github.workspace }}/clang"
        export PATH="$TC_DIR:$PATH"
        
        # 3. PREPARE OUTPUT
        mkdir -p out
        
        # 4. CONFIGURATION (Using Absolute CC Path)
        echo "[*] Generating defconfig..."
        make -j$(nproc) O=out ARCH=arm64 \
            CC="$TC_DIR/clang" \
            CROSS_COMPILE="$TC_DIR/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_DIR/arm-linux-gnueabi-" \
            a32_noobie_defconfig

        echo "[*] Applying olddefconfig..."
        make -j$(nproc) O=out ARCH=arm64 \
            CC="$TC_DIR/clang" \
            CROSS_COMPILE="$TC_DIR/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_DIR/arm-linux-gnueabi-" \
            olddefconfig

        # 5. THE MAIN BUILD
        echo "[*] Starting Final Compilation..."
        make -j$(nproc) O=out \
            ARCH=arm64 \
            CC="$TC_DIR/clang" \
            LD="$TC_DIR/ld.lld" \
            AR="$TC_DIR/llvm-ar" \
            NM="$TC_DIR/llvm-nm" \
            OBJCOPY="$TC_DIR/llvm-objcopy" \
            OBJDUMP="$TC_DIR/llvm-objdump" \
            READELF="$TC_DIR/llvm-readelf" \
            STRIP="$TC_DIR/llvm-strip" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$TC_DIR/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_DIR/arm-linux-gnueabi-" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-w -O2 -pipe -Wno-int-conversion" \
            KCPPFLAGS="-O2"
          
    - name: Upload Kernel Image and DTB
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: A32-Kernel-${{ github.run_id }}
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dtb
          out/arch/arm64/boot/dts/mediatek/*.dtb
        if-no-files-found: error

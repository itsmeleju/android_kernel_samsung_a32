name: A32 Kernel Builder by NoobieThingZ

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mtk-performa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4

      - name: 🗄️ Cache Toolchain & Build
        uses: actions/cache@v4
        with:
          path: |
            clang/
            out/
          key: ${{ runner.os }}-kernel-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-kernel-

      - name: ⚙️ Setup Environment (Local Action)
        uses: ./.github/actions/setup-clang

      - name: 🔨 Build Kernel
        shell: bash
        run: |
          # 1. Define Absolute Path to Clang (Do NOT add to global PATH)
          TC_DIR="${{ github.workspace }}/clang/bin"
          
          # 2. Build Arguments
          # We explicitly define every tool to ensure no cross-contamination
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            CC="$TC_DIR/clang"
            LD="$TC_DIR/ld.lld"
            AR="$TC_DIR/llvm-ar"
            NM="$TC_DIR/llvm-nm"
            OBJCOPY="$TC_DIR/llvm-objcopy"
            OBJDUMP="$TC_DIR/llvm-objdump"
            STRIP="$TC_DIR/llvm-strip"
            READELF="$TC_DIR/llvm-readelf"
            
            # Host tools MUST use system paths to avoid .relr.dyn error
            HOSTCC=/usr/bin/gcc
            HOSTCXX=/usr/bin/g++
            HOSTLD=/usr/bin/ld
            
            # Cross Compilation
            CROSS_COMPILE="$TC_DIR/aarch64-linux-gnu-"
            CROSS_COMPILE_ARM32="$TC_DIR/arm-linux-gnueabi-"
            CLANG_TRIPLE=aarch64-linux-gnu-
            
            # Kernel Specifics
            LLVM=1
            LLVM_IAS=0
            KCFLAGS="-w -pipe -O2 -fno-integrated-as -Wno-error"
            KCPPFLAGS="-O2"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          mkdir -p out

          # 3. Configure
          echo "[*] Configuring with a32_noobie_defconfig..."
          make "${MAKE_ARGS[@]}" a32_noobie_defconfig

          # 4. Build
          echo "[*] Starting Compilation..."
          make -j$(nproc --all) "${MAKE_ARGS[@]}"

      - name: 📤 Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A32-Kernel-Build
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: error

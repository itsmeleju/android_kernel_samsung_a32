name: "Setup Clang & Dependencies"
description: "Installs dependencies and Clang for MTK kernel build"

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libncurses-dev libelf-dev wget git make python3

    - name: Download and Extract ZyC Clang
      shell: bash
      run: |
       if [ ! -d "clang" ]; then
       echo "[*] Downloading Clang..."
       wget -q https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20220724-release/Clang-14.0.6-20220724.tar.gz -O clang.tar.gz
       echo "[*] Extracting..."
       mkdir -p clang
       tar -xf clang.tar.gz -C clang --strip-components=1  # Extract directly into the 'clang' folder
       echo "[*] Cleaning up archive..."
       rm clang.tar.gz
       fi

    - name: Set Environment
      shell: bash
      run: |
        # Add Clang bin to PATH so 'make' finds 'clang' and 'ld.lld' automatically
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH
        
        # Set core variables
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "OS=linux" >> $GITHUB_ENV

name: 'Setup Clang & Environment'
description: 'Installs dependencies and prepares Proton Clang'

runs:
  using: "composite"
  steps:
    - name: 🧰 Install Build Dependencies
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y build-essential bc bison flex curl zip unzip libssl-dev libelf-dev python3 git libncurses5-dev

    - name: ⚡ Download and Extract Clang
      shell: bash
      run: |
        if [ ! -d "clang" ]; then
          echo "[*] Downloading Clang 12..."
          # Using -L to follow redirects and -S to show errors
          curl -LSs https://github.com/ZyCromerZ/Clang/releases/download/12.0.5/Clang-12.0.5-20210719.tar.gz -o clang.tar.gz || exit 1
          
          echo "[*] Extracting Clang..."
          mkdir -p clang
          tar -xf clang.tar.gz -C clang --strip-components=1
          rm clang.tar.gz
        fi
        # Add to PATH for the rest of the job
        echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

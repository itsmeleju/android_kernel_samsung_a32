name: "Setup Clang & Dependencies"
description: "Installs dependencies and Clang for MTK kernel build"

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y build-essential bc bison flex libssl-dev libncurses-dev libelf-dev wget clang lld
    - name: Download prebuilt Clang
      shell: bash
      run: |
        if [ ! -d clang ]; then
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260208-release/Clang-15.0.7-20260208.tar.gz
        tar -xzf Clang-15.0.7-20260208.tar.gz
        mv Clang-* clang
        fi

    - name: Set Clang environment
      shell: bash
      run: |
        echo "PATH=$(pwd)/clang/bin:$PATH" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV

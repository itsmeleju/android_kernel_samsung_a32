name: "Setup Clang & Dependencies"
description: "Installs dependencies and Clang for MTK kernel build"

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libncurses-dev libelf-dev wget git make python3

    - name: Download Proton Clang
      shell: bash
      run: |
        if [ ! -d "clang" ]; then
          echo "[*] Downloading Proton Clang..."
          # Proton Clang is highly compatible with Android Kernel builds
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang
          # Force permissions immediately
          chmod -R +x clang/bin
        fi

    - name: Set Environment
      shell: bash
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        # 3. Define Toolchain Names
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "READELF=llvm-readelf" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        
        # 4. Cross-Compile Prefixes (match the bins in ZyC Clang)
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

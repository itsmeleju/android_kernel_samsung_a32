name: 'Setup Clang & Environment'
description: 'Installs dependencies and prepares Proton Clang'

runs:
  using: "composite"
  steps:
    - name: 🧰 Install Build Dependencies
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y build-essential bc bison flex curl zip unzip libssl-dev libelf-dev python3 git libncurses5-dev

    - name: ⚡ Download and Extract Clang
      shell: bash
      run: |
        if [ ! -d "clang" ]; then
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/12.0.5/Clang-12.0.5-20210719.tar.gz
          tar -xf Clang-12.0.5-20210719.tar.gz
          mv Clang-12.0.5-20210719 clang
        fi
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH

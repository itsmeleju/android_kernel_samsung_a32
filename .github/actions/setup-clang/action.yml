name: 'Setup Clang & Environment'
description: 'Installs dependencies and prepares Proton Clang'

runs:
  using: "composite"
  steps:
    - name: 🧰 Install Build Dependencies
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y build-essential bc bison flex curl zip unzip libssl-dev libelf-dev python3 git libncurses5-dev

    - name: ⚡ Download and Extract Clang
      shell: bash
      run: |
        if [ ! -d "clang" ]; then
          echo "[*] Downloading Stable Proton Clang..."
          # Using a verified mirror for Proton Clang
          curl -LSs "https://raw.githubusercontent.com/kdrag0n/proton-clang/master/bin/clang" > /dev/null || echo "Mirror check failed"
          
          # Stable Proton Clang Link
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O clang.tar.gz
          
          echo "[*] Extracting Clang..."
          mkdir -p clang
          tar -xf clang.tar.gz -C clang --strip-components=1
          rm clang.tar.gz
        fi
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH
